<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <rect width="1200" height="540" fill="white"/>

  <!-- Arrow marker -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="30" font-size="24" font-weight="600" fill="#333" text-anchor="middle">SeedLearn Pipeline Architecture</text>
  <text x="600" y="52" font-size="14" fill="#888" text-anchor="middle">Parallel evidence channels: visual embeddings + morphological language → taxonomic identification</text>

  <!-- ════════════════════════════════════════════════════════ -->
  <!--   INPUT: 5 sample image thumbnails (stacked)            -->
  <!-- ════════════════════════════════════════════════════════ -->

  <!-- Image stack: 5 overlapping thumbnails -->
  <rect x="32" y="198" width="56" height="56" rx="4" fill="#e8e8e8" stroke="#bbb" stroke-width="1" transform="rotate(-6 60 226)"/>
  <rect x="37" y="202" width="56" height="56" rx="4" fill="#ddd" stroke="#bbb" stroke-width="1" transform="rotate(-3 65 230)"/>
  <rect x="42" y="206" width="56" height="56" rx="4" fill="#d2d2d2" stroke="#bbb" stroke-width="1" transform="rotate(0 70 234)"/>
  <rect x="47" y="210" width="56" height="56" rx="4" fill="#c8c8c8" stroke="#bbb" stroke-width="1" transform="rotate(3 75 238)"/>
  <rect x="52" y="214" width="56" height="56" rx="4" fill="#bbb" stroke="#999" stroke-width="1" transform="rotate(6 80 242)"/>
  <!-- Leaf icon on top image -->
  <text x="80" y="248" font-size="20" text-anchor="middle" fill="#666">&#127793;</text>

  <text x="72" y="188" font-size="13" font-weight="600" fill="#333" text-anchor="middle">Specimen</text>
  <text x="72" y="290" font-size="11" fill="#888" text-anchor="middle">(1-N images)</text>

  <!-- ════════════════════════════════════════════════════════ -->
  <!--   SPLIT: input fans out to two parallel paths            -->
  <!-- ════════════════════════════════════════════════════════ -->

  <!-- Split line from input center to fork point -->
  <line x1="116" y1="238" x2="148" y2="238" stroke="#888" stroke-width="1.5"/>
  <!-- Fork: top branch (image path) -->
  <line x1="148" y1="238" x2="148" y2="155" stroke="#888" stroke-width="1.5"/>
  <line x1="148" y1="155" x2="192" y2="155" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Fork: bottom branch (language path) -->
  <line x1="148" y1="238" x2="148" y2="395" stroke="#888" stroke-width="1.5"/>
  <line x1="148" y1="395" x2="192" y2="395" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ════════════════════════════════════════════════════════ -->
  <!--   PATH LABELS (above each row, not overlapping blocks)   -->
  <!-- ════════════════════════════════════════════════════════ -->

  <text x="266" y="78" font-size="13" font-weight="600" fill="#999" letter-spacing="2">IMAGE PATH</text>
  <text x="266" y="328" font-size="13" font-weight="600" fill="#999" letter-spacing="2">LANGUAGE PATH</text>

  <!-- ════════════════════════════════════════════════════════ -->
  <!--   TOP ROW: Image Path                                    -->
  <!--   BioCLIP 2 Classification → predictions (long arrow)    -->
  <!-- ════════════════════════════════════════════════════════ -->

  <!-- ── BioCLIP Classification ── -->
  <rect x="194" y="88" width="172" height="134" rx="8" fill="#f28e2b" stroke="#c47220" stroke-width="1.5"/>
  <text x="280" y="112" font-size="14" font-weight="700" fill="white" text-anchor="middle">Visual Classification</text>
  <line x1="206" y1="120" x2="354" y2="120" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <text x="280" y="142" font-size="12" fill="white" text-anchor="middle">GPU · BioCLIP 2</text>
  <text x="280" y="160" font-size="12" fill="white" text-anchor="middle">SimpleShot few-shot</text>
  <text x="280" y="184" font-size="11" fill="white" text-anchor="middle">768-dim embeddings →</text>
  <text x="280" y="200" font-size="11" fill="white" text-anchor="middle">top-k taxa predictions</text>

  <!-- Arrow: BioCLIP → predictions pill -->
  <line x1="368" y1="155" x2="380" y2="155" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── predictions data node ── -->
  <rect x="382" y="141" width="108" height="28" rx="14" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="436" y="160" font-size="11" fill="#555" text-anchor="middle">taxa predictions</text>

  <!-- Long dashed arrow: predictions → merge point -->
  <line x1="492" y1="155" x2="830" y2="155" stroke="#888" stroke-width="1.5" stroke-dasharray="8 4"/>
  <!-- Vertical down to merge -->
  <line x1="830" y1="155" x2="830" y2="255" stroke="#888" stroke-width="1.5"/>
  <line x1="830" y1="255" x2="850" y2="265" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ════════════════════════════════════════════════════════ -->
  <!--   BOTTOM ROW: Language Path                              -->
  <!--   Vision-LLM → traits → RAG → matches                   -->
  <!-- ════════════════════════════════════════════════════════ -->

  <!-- ── Vision-LLM Morphology ── -->
  <rect x="194" y="340" width="172" height="134" rx="8" fill="#4e79a7" stroke="#3a5d82" stroke-width="1.5"/>
  <text x="280" y="364" font-size="14" font-weight="700" fill="white" text-anchor="middle">Morphology Extraction</text>
  <line x1="206" y1="372" x2="354" y2="372" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <text x="280" y="394" font-size="12" fill="white" text-anchor="middle">GPU · vLLM</text>
  <text x="280" y="412" font-size="12" fill="white" text-anchor="middle">Qwen3-VL-32B</text>
  <text x="280" y="436" font-size="11" fill="white" text-anchor="middle">Vision-LLM extracts</text>
  <text x="280" y="452" font-size="11" fill="white" text-anchor="middle">24 morphological traits</text>

  <!-- Arrow: Vision-LLM → traits pill -->
  <line x1="368" y1="407" x2="380" y2="407" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── traits data node ── -->
  <rect x="382" y="393" width="108" height="28" rx="14" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="436" y="412" font-size="11" fill="#555" text-anchor="middle">morphology traits</text>

  <!-- Arrow: traits → RAG -->
  <line x1="492" y1="407" x2="504" y2="407" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── RAG Retrieval ── -->
  <rect x="506" y="340" width="172" height="134" rx="8" fill="#e15759" stroke="#b84547" stroke-width="1.5"/>
  <text x="592" y="364" font-size="14" font-weight="700" fill="white" text-anchor="middle">Literature Retrieval</text>
  <line x1="518" y1="372" x2="666" y2="372" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <text x="592" y="394" font-size="12" fill="white" text-anchor="middle">CPU · FAISS</text>
  <text x="592" y="412" font-size="12" fill="white" text-anchor="middle">RAG semantic search</text>
  <text x="592" y="436" font-size="11" fill="white" text-anchor="middle">3,498 botanical trait</text>
  <text x="592" y="452" font-size="11" fill="white" text-anchor="middle">descriptions</text>

  <!-- Arrow: RAG → matches pill -->
  <line x1="680" y1="407" x2="692" y2="407" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── matches data node ── -->
  <rect x="694" y="393" width="108" height="28" rx="14" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="748" y="412" font-size="11" fill="#555" text-anchor="middle">literature matches</text>

  <!-- Arrow: matches → merge point (curves up to reasoning) -->
  <line x1="804" y1="407" x2="830" y2="407" stroke="#888" stroke-width="1.5"/>
  <!-- Vertical up to merge -->
  <line x1="830" y1="407" x2="830" y2="278" stroke="#888" stroke-width="1.5"/>
  <line x1="830" y1="278" x2="850" y2="268" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ════════════════════════════════════════════════════════ -->
  <!--   MERGE + REASONING                                      -->
  <!-- ════════════════════════════════════════════════════════ -->

  <!-- ── Reasoning LLM ── -->
  <rect x="852" y="200" width="172" height="134" rx="8" fill="#59a14f" stroke="#47813f" stroke-width="1.5"/>
  <text x="938" y="224" font-size="14" font-weight="700" fill="white" text-anchor="middle">Reasoning</text>
  <line x1="864" y1="232" x2="1012" y2="232" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <text x="938" y="254" font-size="12" fill="white" text-anchor="middle">GPU · vLLM</text>
  <text x="938" y="272" font-size="12" fill="white" text-anchor="middle">Qwen3-32B (text-only)</text>
  <text x="938" y="296" font-size="11" fill="white" text-anchor="middle">Synthesizes all evidence</text>
  <text x="938" y="312" font-size="11" fill="white" text-anchor="middle">→ final classification</text>

  <!-- Arrow: Reasoning → Output -->
  <line x1="1026" y1="267" x2="1044" y2="267" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ════════════════════════════════════════════════════════ -->
  <!--   OUTPUT                                                 -->
  <!-- ════════════════════════════════════════════════════════ -->

  <polygon points="1046,267 1066,200 1176,200 1156,267 1176,334 1066,334" fill="#555" stroke="#333" stroke-width="1.5"/>
  <text x="1113" y="250" font-size="12" font-weight="600" fill="white" text-anchor="middle">Taxonomic</text>
  <text x="1113" y="268" font-size="12" font-weight="600" fill="white" text-anchor="middle">Classification</text>
  <text x="1113" y="288" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">family / genus / species</text>
  <text x="1113" y="304" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">+ confidence + reasoning</text>

  <!-- ════════════════════════════════════════════════════════ -->
  <!--   PARALLEL INDICATOR (between rows)                      -->
  <!-- ════════════════════════════════════════════════════════ -->

  <line x1="172" y1="226" x2="172" y2="336" stroke="#ccc" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="172" y="284" font-size="10" fill="#bbb" text-anchor="middle" transform="rotate(-90 172 284)">parallel</text>
</svg>
